<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIST DOOM — Radar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0a0a0a; overflow:hidden;
    font-family:"Courier New",monospace; color:#7CFC00; }
  #wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; background:#050505; box-shadow:0 0 20px #0f0a; }
  #st { position:absolute; top:6px; left:8px; font-size:10px; color:#4a4; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="300"></canvas></div>
<div id="st">RADAR: …</div>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<script>
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d"), st=document.getElementById("st");
let MAP=[[1]], mw=1, mh=1, monsters=[], players=[];

function draw(){
  const W=cv.width,H=cv.height;
  ctx.fillStyle="#050505"; ctx.fillRect(0,0,W,H);
  const cs=Math.min(W/mw, H/mh), ox=(W-mw*cs)/2, oy=(H-mh*cs)/2;
  for(let y=0;y<mh;y++) for(let x=0;x<mw;x++){
    ctx.fillStyle = (MAP[y]&&MAP[y][x]) ? "#1f3a1f" : "#0c140c";
    ctx.fillRect(ox+x*cs, oy+y*cs, cs-1, cs-1);
  }
  for(const m of monsters){ if(!m.alive) continue;
    ctx.fillStyle=m.color||"#f33"; ctx.beginPath();
    ctx.arc(ox+(m.x+0.5)*cs, oy+(m.y+0.5)*cs, cs*0.28, 0, 7); ctx.fill(); }
  for(const p of players){
    ctx.fillStyle=p.color||"#58a6ff";
    ctx.beginPath(); ctx.arc(ox+(p.x+0.5)*cs, oy+(p.y+0.5)*cs, cs*0.34, 0, 7); ctx.fill();
    ctx.strokeStyle=p.color||"#58a6ff"; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(ox+(p.x+0.5)*cs, oy+(p.y+0.5)*cs);
    ctx.lineTo(ox+(p.x+0.5+Math.cos(p.dir||0)*0.9)*cs, oy+(p.y+0.5+Math.sin(p.dir||0)*0.9)*cs); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font=Math.max(7,cs*0.4)+"px monospace"; ctx.textAlign="center";
    ctx.fillText(p.name||"P", ox+(p.x+0.5)*cs, oy+(p.y-0.1)*cs);
  }
}
requestAnimationFrame(function f(){ draw(); requestAnimationFrame(f); });

async function pull(){
  try{
    const c=await grist.docApi.fetchTable("Carte");
    if(c.id&&c.id.length){ const rows=[];
      for(let i=0;i<c.id.length;i++){ const y=c.Y[i]; const r=[];
        for(let x=0;x<16;x++) r.push(c["C"+x]&&c["C"+x][i]?1:0); rows[y]=r; }
      const clean=rows.filter(Boolean); if(clean.length){ MAP=clean; mh=clean.length; mw=clean[0].length; } }
    const m=await grist.docApi.fetchTable("Monstres");
    if(m.id){ const l=[]; for(let i=0;i<m.id.length;i++){
      if(typeof m.X[i]!=="number") continue;
      l.push({x:m.X[i],y:m.Y[i],alive:m.Vivant?!!m.Vivant[i]:true,color:(m.Couleur&&m.Couleur[i])?m.Couleur[i]:"#f33"}); }
      monsters=l; }
    const j=await grist.docApi.fetchTable("Joueurs");
    if(j.id){ const l=[]; for(let i=0;i<j.id.length;i++){
      if(!j.Actif||!j.Actif[i]) continue; if(typeof j.PosX[i]!=="number") continue;
      l.push({x:j.PosX[i],y:j.PosY[i],dir:j.Dir?j.Dir[i]:0,color:(j.Couleur&&j.Couleur[i])?j.Couleur[i]:"#58a6ff",name:(j.Nom&&j.Nom[i])?j.Nom[i]:"P"}); }
      players=l; }
    st.textContent="RADAR: connecté"; st.style.color="#7CFC00";
  }catch(e){}
}
try{ if(typeof grist!=="undefined"&&grist.ready){ grist.ready({requiredAccess:"full"});
  grist.onRecords(()=>pull()); setInterval(pull,700); } }catch(e){}
</script>
</body>
</html>
